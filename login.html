<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wise Wallet — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="static/app.css">
<script src="static/app.js" defer></script>
<style>
  body{ align-items:center; min-height:100vh; }
  .app{ display:flex; flex-direction:column; justify-content:center; min-height:100vh; padding: 30px 26px; }

  .login-brand{ display:flex; flex-direction:column; align-items:center; margin-bottom:40px; }
  .login-mark{
    width:56px; height:56px; border-radius:18px;
    background: linear-gradient(135deg, var(--violet), var(--mint));
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 10px 30px var(--violet-glow);
    margin-bottom:16px;
  }
  .login-mark svg{ width:26px; height:26px; }
  .login-title{ font-family:var(--display); font-size:22px; font-weight:700; }
  .login-sub{ font-size:13px; color:var(--text-mid); margin-top:6px; text-align:center; }

  .auth-btn{
    display:flex; align-items:center; justify-content:center; gap:10px;
    width:100%; padding:14px; border-radius:14px;
    font-size:14px; font-weight:600; margin-bottom:12px;
    border:1px solid var(--card-border);
  }
  .auth-google{ background:#fff; color:#1F1F1F; }
  .auth-email{ background:var(--card-solid); color:var(--text-hi); }
  .auth-phone{ background:transparent; color:var(--text-mid); border:1px dashed var(--card-border); }

  .divider{ display:flex; align-items:center; gap:10px; margin: 18px 0; }
  .divider::before, .divider::after{ content:''; flex:1; height:1px; background:var(--card-border); }
  .divider span{ font-size:11px; color:var(--text-low); font-family:var(--mono); text-transform:uppercase; }

  .email-form{ display:none; flex-direction:column; gap:12px; margin-bottom:12px; }
  .email-form.open{ display:flex; }
  .field-input{
    display:flex; align-items:center; gap:8px;
    background: rgba(255,255,255,0.03); border:1px solid var(--card-border);
    border-radius: 12px; padding: 13px 14px;
  }
  .field-input input{
    background:none; border:none; outline:none; color:var(--text-hi);
    font-family:var(--body); font-size:13.5px; width:100%;
  }
  .btn-continue{
    width:100%; padding:14px; border-radius:14px; border:none;
    background: linear-gradient(135deg, var(--violet), #6B4FE0);
    color:var(--text-hi); font-weight:600; font-size:14px;
  }

  .login-foot{ text-align:center; font-size:11.5px; color:var(--text-low); margin-top:18px; line-height:1.6; }
  .login-foot a{ color:var(--violet); }
</style>
</head>
<body>
<div class="app">

  <div class="login-brand">
    <div class="login-mark">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="white" stroke-width="1.6"/><circle cx="12" cy="12" r="4" fill="white"/></svg>
    </div>
    <div class="login-title">Welcome to Wise Wallet</div>
    <div class="login-sub">Sign in to track your money and<br>keep your goals honest.</div>
  </div>

  <button id="loginGoogle" class="auth-btn auth-google">
    <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.71v2.26h2.9c1.7-1.57 2.7-3.87 2.7-6.61z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.19l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.69A5.4 5.4 0 0 1 3.66 9c0-.59.1-1.16.29-1.69V4.98H.98A9 9 0 0 0 0 9c0 1.45.35 2.83.98 4.02l2.97-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .98 4.98L3.95 7.3C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
    Continue with Google
  </button>

  <button id="loginEmail" class="auth-btn auth-email">
    ✉️ Continue with Email
  </button>

  <div class="email-form" id="emailForm">
    <div class="field-input"><input id="emailInput" type="email" placeholder="Email address" /></div>
    <div class="field-input"><input id="passwordInput" type="password" placeholder="Password" /></div>
    <button id="loginEmailContinue" class="btn-continue">Continue</button>
  </div>

  <div class="divider"><span>or</span></div>

  <button id="loginPhone" class="auth-btn auth-phone">
    📱 Continue with phone number
  </button>

  <div class="login-foot">
    By continuing you agree to Wise Wallet's<br>
    <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
  </div>

</div>
</body>
</html>
